<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gadget & Source</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6fa;color:#172033}
header{background:#101827;color:white;padding:20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:24px;font-weight:bold}
.logo span{color:#60a5fa}
button{background:#2563eb;color:white;border:0;padding:12px 18px;border-radius:8px;cursor:pointer}
.hero{background:linear-gradient(120deg,#101827,#2563eb);color:white;text-align:center;padding:65px 15px}
.hero h1{font-size:34px}
main{max-width:1100px;margin:auto;padding:25px 15px}
input{width:100%;padding:14px;border:1px solid #ddd;border-radius:8px;margin-bottom:20px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
.card{background:white;padding:18px;border-radius:12px;box-shadow:0 3px 12px #0001}
.pic{background:#eaf1ff;height:120px;display:grid;place-items:center;font-size:48px;border-radius:10px}
.card h3{margin-bottom:8px}
.price{color:#2563eb;font-weight:bold}
footer{text-align:center;background:#101827;color:white;padding:25px;margin-top:35px}
#cart{background:white;padding:15px;border-radius:10px;margin-top:20px}
</style>
</head>
<body>
<header>
<div class="logo">Gadget <span>&</span> Source</div>
<button onclick="showCart()">Cart (<span id="count">0</span>)</button>
</header>

<section class="hero">
<h1>Welcome to Gadget & Source</h1>
<p>Your Trusted Online Gadget Store</p>
<p>সেরা IT Accessories ও Gadgets এক জায়গায়</p>
</section>

<main>
<h2>Our Products</h2>
<input id="search" placeholder="পণ্য খুঁজুন..." oninput="render()">
<div class="products" id="products"></div>

<div id="cart" style="display:none">
<h2>Shopping Cart</h2>
<div id="items"></div>
<button onclick="order()">Order on WhatsApp</button>
</div>
</main>

<footer>
<h3>Gadget & Source</h3>
<p>Online Gadget Store</p>
<p>WhatsApp: +8801405345702</p>
</footer>

<script>
const products=[
{id:1,name:"USB-C Hub Adapter",icon:"🔌"},
{id:2,name:"Fast Charger",icon:"🔋"},
{id:3,name:"USB-C Cable",icon:"🔗"},
{id:4,name:"SSD Enclosure",icon:"💽"},
{id:5,name:"Wireless Mouse",icon:"🖱️"},
{id:6,name:"Keyboard",icon:"⌨️"}
];
let cart=[];

function render(){
let q=document.getElementById("search").value.toLowerCase();
document.getElementById("products").innerHTML=products
.filter(p=>p.name.toLowerCase().includes(q))
.map(p=>`
<div class="card">
<div class="pic">${p.icon}</div>
<h3>${p.name}</h3>
<p class="price">দাম জানতে যোগাযোগ করুন</p>
<button onclick="add(${p.id})">Add to Cart</button>
</div>`).join("");
}
function add(id){
cart.push(id);
document.getElementById("count").innerText=cart.length;
}
function showCart(){
document.getElementById("cart").style.display="block";
document.getElementById("items").innerHTML=cart.length?
cart.map(id=>"<p>"+products.find(p=>p.id===id).name+"</p>").join("")
:"Cart is empty";
}
function order(){
if(!cart.length){alert("প্রথমে পণ্য যোগ করুন");return;}
let msg="আসসালামু আলাইকুম, আমি অর্ডার করতে চাই:\n"+
cart.map(id=>products.find(p=>p.id===id).name).join("\n");
window.open("https://wa.me/8801405345702?text="+encodeURIComponent(msg));
}
render();
</script>
</body>
</html>
