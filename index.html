<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gadget & Source | Online Store</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6fa;color:#172033}
header{background:#101c35;color:white;padding:18px;text-align:center}
header h1{margin:0;font-size:27px}
header p{margin:7px 0 0;color:#cbd5e1}
.hero{background:#173b70;color:white;text-align:center;padding:35px 15px}
.hero h2{font-size:26px;margin:0 0 10px}
.search{display:block;width:92%;max-width:550px;margin:18px auto;padding:13px;border:1px solid #ddd;border-radius:9px;font-size:16px}
.categories{display:flex;gap:8px;overflow-x:auto;padding:12px}
.categories button{white-space:nowrap;border:0;background:#e2e8f0;padding:10px 14px;border-radius:20px;cursor:pointer}
.categories button.active{background:#173b70;color:white}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:13px;padding:14px}
.card{background:white;border-radius:12px;padding:12px;box-shadow:0 2px 9px #0001}
.card img{width:100%;height:145px;object-fit:contain}
.card h3{font-size:15px;min-height:35px}
.price{font-weight:bold;color:#087443}
.card button,.checkout{width:100%;padding:11px;border:0;border-radius:7px;background:#173b70;color:white;margin-top:8px;cursor:pointer}
.cart{background:white;margin:14px;padding:15px;border-radius:12px}
#status{text-align:center;padding:18px;color:#475569}
footer{text-align:center;background:#101c35;color:white;padding:20px;margin-top:25px}
</style>
</head>
<body>

<header>
<h1>Gadget & Source</h1>
<p>Your Trusted Gadget & Accessories Store</p>
</header>

<section class="hero">
<h2>Welcome to Gadget & Source</h2>
<p>Find Your Favourite Gadgets & Accessories</p>
</section>

<input id="search" class="search" placeholder="Search products..." oninput="renderProducts()">

<div class="categories" id="categories"></div>

<div id="status">Connecting to store...</div>
<main class="products" id="products"></main>

<section class="cart">
<h2>🛒 Shopping Cart</h2>
<div id="cartItems">Your cart is empty.</div>
<h3 id="total">Total: ৳0</h3>
<button class="checkout" onclick="checkout()">Order on WhatsApp</button>
</section>

<footer>
<p>Gadget & Source</p>
<p>WhatsApp: +8801405345702</p>
</footer>

<script>
const SUPABASE_URL = "https://ojmzpntgfbjbflhlaxsb.supabase.co";

// এখানে নিজের Publishable Key বসাবে। কাউকে পাঠাবে না।
const SUPABASE_KEY = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";

const categories = [
"All Products",
"UGREEN Hub & Adapter",
"USB-C Cable",
"Charger & Power Bank",
"SSD, HDD & Enclosure",
"Mouse & Keyboard",
"Monitor & Accessories",
"Laptop & MacBook Accessories",
"iPhone & iPad Accessories",
"HDMI & Display Cable",
"LAN & Networking",
"Earphone & Headphone",
"USB Flash Drive & Memory Card",
"Webcam & Microphone",
"Computer Accessories",
"Gaming Accessories"
];

let db = null;
let allProducts = [];
let cart = [];
let selectedCategory = "All Products";

function setupCategories(){
 const box = document.getElementById("categories");
 box.innerHTML = "";
 categories.forEach(category=>{
  const btn = document.createElement("button");
  btn.textContent = category;
  if(category === selectedCategory) btn.classList.add("active");
  btn.onclick = ()=>{
   selectedCategory = category;
   setupCategories();
   renderProducts();
  };
  box.appendChild(btn);
 });
}

async function loadProducts(){
 const status = document.getElementById("status");

 if(SUPABASE_KEY === "PASTE_YOUR_SB_PUBLISHABLE_KEY_HERE"){
  status.textContent = "প্রথমে Supabase Publishable Key যুক্ত করতে হবে।";
  return;
 }

 try{
  db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

  const {data,error} = await db
   .from("products")
   .select("id,name,category,price,image_url,description,stock,is_active")
   .eq("is_active",true)
   .order("created_at",{ascending:false});

  if(error) throw error;

  allProducts = data || [];
  status.textContent = allProducts.length
   ? "Products loaded successfully"
   : "এখনো কোনো পণ্য যোগ করা হয়নি।";

  renderProducts();
 }catch(error){
  status.textContent = "পণ্য লোড হয়নি: " + error.message;
 }
}

function renderProducts(){
 const box = document.getElementById("products");
 const search = document.getElementById("search").value.toLowerCase();

 box.innerHTML = "";

 const filtered = allProducts.filter(p=>{
  const matchesSearch = (p.name || "").toLowerCase().includes(search);
  const matchesCategory = selectedCategory === "All Products" ||
   p.category === selectedCategory;
  return matchesSearch && matchesCategory;
 });

 if(filtered.length === 0){
  box.innerHTML = "<p>কোনো পণ্য পাওয়া যায়নি।</p>";
  return;
 }

 filtered.forEach(p=>{
  const card = document.createElement("div");
  card.className = "card";

  const img = document.createElement("img");
  img.src = p.image_url || "";
  img.alt = p.name || "Product";
  img.onerror = ()=>{img.style.display="none";};

  const name = document.createElement("h3");
  name.textContent = p.name || "Product";

  const price = document.createElement("p");
  price.className = "price";
  price.textContent = "৳" + Number(p.price || 0).toLocaleString("en-US");

  const description = document.createElement("p");
  description.textContent = p.description || "";

  const button = document.createElement("button");
  button.textContent = "Add to Cart";
  button.onclick = ()=>addToCart(p.id);

  card.append(img,name,price,description,button);
  box.appendChild(card);
 });
}

function addToCart(id){
 const product = allProducts.find(p=>p.id===id);
 if(!product) return;

 const existing = cart.find(item=>item.id===id);
 if(existing) existing.quantity++;
 else cart.push({...product,quantity:1});

 renderCart();
}

function renderCart(){
 const box = document.getElementById("cartItems");
 const totalBox = document.getElementById("total");

 if(cart.length === 0){
  box.textContent = "Your cart is empty.";
  totalBox.textContent = "Total: ৳0";
  return;
 }

 box.innerHTML = "";
 let total = 0;

 cart.forEach(item=>{
  total += Number(item.price || 0) * item.quantity;

  const row = document.createElement("p");
  row.textContent = item.name + " × " + item.quantity +
   " = ৳" + (Number(item.price || 0)*item.quantity);
  box.appendChild(row);
 });

 totalBox.textContent = "Total: ৳" + total.toLocaleString("en-US");
}

function checkout(){
 if(cart.length === 0){
  alert("আপনার Cart খালি!");
  return;
 }

 let message = "Assalamu Alaikum, I want to order:\n\n";
 let total = 0;

 cart.forEach(item=>{
  const amount = Number(item.price || 0)*item.quantity;
  total += amount;
  message += item.name + " x " + item.quantity +
   " = ৳" + amount + "\n";
 });

 message += "\nTotal: ৳" + total + "\n";
 message += "\nPlease confirm my order.";

 const url = "https://wa.me/8801405345702?text=" +
  encodeURIComponent(message);

 window.open(url,"_blank");
}

setupCategories();
loadProducts();
</script>

</body>
</html>
